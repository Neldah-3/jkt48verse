name: CI Check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.agent/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mypage48_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: dev
      SECRET_KEY: dummy_secret_key_for_testing_12345
      ALGORITHM: HS256
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mypage48_test
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      GOOGLE_REDIRECT_URI: http://localhost
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      GITHUB_REDIRECT_URI: http://localhost
      FRONTEND_URL: http://localhost:3000
      ORIGINS: http://localhost:3000
      RESEND_API_KEY: dummy
      OAUTHLIB_INSECURE_TRANSPORT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
